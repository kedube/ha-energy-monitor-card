name: CI

# Runs on pull requests. Pushes to main run the same jobs through release.yml,
# so a release is only published from a commit that passed CI.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Committed bundle is up to date
        run: git diff --exit-code -- dist/

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
          ignore: brands
